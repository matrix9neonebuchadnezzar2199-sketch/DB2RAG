services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: db2rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: db2rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: db2rag_lab
      MYSQL_DATABASE: hr
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data/mysql_data:/var/lib/mysql
      - ./testdata/mysql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
