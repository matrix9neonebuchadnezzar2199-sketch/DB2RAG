[project]
name = "db2rag"
version = "0.1.0"
description = "Convert internal MySQL and local documents into a local persistent RAG knowledge base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "masterneo", email = "masterneo@example.com" }]
dependencies = [
    "click>=8.1.0,<9.0.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "mysql-connector-python>=9.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdown-it-py>=3.0.0",
    "reportlab>=4.2.0",
    "cryptography>=43.0.0",
    "python-ulid>=2.7.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0.0"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
db2rag = "db2rag.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db2rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "PTH", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
